name: Windows 检查
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    env:
      CARGO_BUILD_JOBS: 1
    steps:
      - uses: actions/checkout@v4
      - name: 安装 Rust stable
        run: rustup toolchain install stable --profile minimal
      - name: 验证 HTTP 代理请求格式
        run: cargo +stable test --locked --manifest-path vendor/ureq/Cargo.toml --lib --no-default-features --features tls,gzip --target x86_64-pc-windows-msvc unit::tests
      - name: 测试
        env:
          # 授权文件夹具使用普通长路径，避免 Windows 默认 TEMP 的 8.3 短名。
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: cargo +stable test --locked --all-targets --features record,sdk-js,sdk-material --target x86_64-pc-windows-msvc -- --test-threads=1
      - name: 检查安装脚本语法
        shell: pwsh
        run: |
          Get-ChildItem installer,scripts -Filter *.ps1 -Recurse | ForEach-Object {
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName,[ref]$null,[ref]$parseErrors) | Out-Null
            if ($parseErrors) { throw ($parseErrors | Out-String) }
          }
      # 唯一打包入口：installer/build-innosetup.ps1（Inno Setup，GitHub runner 自带）。
      # 它会构建主程序 + bridge + 内置电量组件，编译 daozai.iss，产出 dist 下
      # Daozai-Setup-vX-x64.exe / Daozai-vX-windows-x64.zip / SHA256SUMS.txt。
      - name: 验证发布构建与 Inno 打包
        shell: pwsh
        run: ./installer/build-innosetup.ps1
      - name: 验证正式程序的诊断归档
        shell: pwsh
        run: ./tests/diagnostics_archive.ps1 -Executable (Join-Path $pwd 'target\release\daozai.exe')
  update:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: 验证应用内更新替换流程
        shell: pwsh
        run: |
          ./tests/update_installer.ps1
          exit 0
