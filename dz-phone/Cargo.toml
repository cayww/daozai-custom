[package]
name = "daozai"
version = "1.3.0"
edition = "2021"
license = "MIT"
description = "岛仔：Windows 顶部的桌面伙伴与信息岛"
repository = "https://github.com/cayww/daozai-custom"
default-run = "daozai"

[lib]
name = "daozai"
path = "src/lib.rs"

[[bin]]
name = "daozai"
path = "src/main.rs"

# 独立精简的浏览器扩展桥宿主：不链接 GUI 栈，只做下载事件 → island_status.json 的翻译。
# 安装包把编译出的 daozai-bridge.exe 复制为 daozai_bridge.exe（见 installer/daozai.iss）。
[[bin]]
name = "daozai-bridge"
path = "src/bin/daozai-bridge/main.rs"

# 无窗口演示录制器：脚本驱动 + 软件光栅化，输出 RGBA 帧流给 ffmpeg。
[[bin]]
name = "daozai-record"
path = "src/bin/daozai-record/main.rs"
required-features = ["record"]

[features]
record = []
# 内存剖析：cargo build --features memprof。Profiler 在进程退出时把 dhat-heap.json
# 写到工作目录，main 里再挪进 data\diagnostics；配合 DAOZAI_MEMPROF_EXIT=<秒> 自动优雅退出。
memprof = ["dep:dhat"]
# 上游 v0.6.70 的插件 SDK 特性；定制版走 D3D11 + 自绘渲染栈，不启用 eframe/direct-composition。
sdk-js = ["dep:ab_glyph"]
sdk-material = [
  "dep:bytemuck", "dep:pollster",
  "windows/Graphics", "windows/Graphics_Capture", "windows/Graphics_DirectX", "windows/Graphics_DirectX_Direct3D11",
  "windows/Win32_Graphics_Direct3D", "windows/Win32_Graphics_Direct3D11",
  "windows/Win32_Graphics_Dxgi", "windows/Win32_Graphics_Dxgi_Common",
  "windows/Win32_System_WinRT_Direct3D11", "windows/Win32_System_WinRT_Graphics_Capture",
]
sdk-wasm = ["dep:wasmi"]

[patch.crates-io]
imap = { path = "vendor/imap" }
imap-proto = { path = "vendor/imap-proto" }
ureq = { path = "vendor/ureq" }
# egui/eframe/egui-winit vendor patches removed for egui 0.35.
# The legacy wgpu/D3D12/WGSL stack is gone; rendering is D3D11 + winit only.
# Pin all egui crates to upstream main commit 90431d9.

[dependencies]
eframe = { git = "https://github.com/emilk/egui.git", rev = "90431d979ab1faae2de6d9f736e9d33ca0d31956", default-features = false, features = ["glow", "default_fonts", "system_fonts"] }
egui = { git = "https://github.com/emilk/egui.git", rev = "90431d979ab1faae2de6d9f736e9d33ca0d31956", features = ["rayon", "monochrome_emoji_fonts"] }
log = "0.4"
dhat = { version = "0.3", optional = true }
egui_extras = { git = "https://github.com/emilk/egui.git", rev = "90431d979ab1faae2de6d9f736e9d33ca0d31956", default-features = false, features = ["svg", "image"] }
egui_system_font_provider = { git = "https://github.com/emilk/egui.git", rev = "90431d979ab1faae2de6d9f736e9d33ca0d31956" }
# 上游 v0.6.70 新增：插件 JS 文本测量 + SVG 路径解析。
ab_glyph = { version = "0.2", optional = true }
svgtypes = "0.13"
ureq = { version = "2.12", default-features = false, features = ["tls", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
flate2 = "1"
zstd = { version = "0.13.3", default-features = false }
ring = "0.17"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
raw-window-handle = "0.6"
# v0.5.5 邮件：MIME 解析与验证码打分是纯逻辑，保持跨平台。
mailparse = "0.18"
regex = "1"
roxmltree = "0.19"
url = "2"
chrono = "0.4"
chrono-tz = { version = "0.10", features = ["serde"] }
iana-time-zone = "0.1"
rrule = "0.14.0"
rquickjs = "0.8"
wasmi = { version = "=0.46.0", optional = true, default-features = false, features = ["std"] }

# Linux 下 winit 至少要一个后端才能编译（只用于开发/录制，正式目标是 Windows）。
[target.'cfg(target_os = "linux")'.dependencies]
eframe = { git = "https://github.com/emilk/egui.git", rev = "90431d979ab1faae2de6d9f736e9d33ca0d31956", default-features = false, features = ["glow", "default_fonts", "system_fonts", "x11"] }

[target.'cfg(windows)'.dependencies]
bytemuck = { version = "1", features = ["derive"], optional = true }
pollster = { version = "0.4", optional = true }
zip = { version = "9.7", default-features = false, features = ["deflate-flate2"] }
ureq = { version = "2.12", default-features = false, features = ["native-tls"] }
tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
clipboard-win = "5.4.3"
memmap2 = "0.9.12"
# D3D11 自绘栈（从 egui-directx11 移植到 windows 0.58）：winit 事件循环 + egui 平台桥
egui-winit = { git = "https://github.com/emilk/egui.git", rev = "90431d979ab1faae2de6d9f736e9d33ca0d31956", default-features = false }
winit = { version = "0.30", default-features = false, features = ["rwh_06"] }
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_Devices_Display",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_DirectComposition",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Wdk_Graphics_Direct3D", "Win32_Graphics_Dxgi", "Win32_System_Performance", "Wdk_System_SystemInformation", "Win32_System_ProcessStatus",
  "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock",
  "Win32_System_Com",
  "Win32_System_DataExchange",
  "Win32_Security",
  "Win32_Security_Cryptography",
  "Win32_Security_Cryptography_Catalog",
  "Win32_Security_Cryptography_Sip",
  "Win32_Security_WinTrust",
  "Win32_System_Power",
  "Win32_System_Registry",
  "Win32_System_IO",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_System_JobObjects",
  "Win32_System_Pipes",
  "Win32_System_RemoteDesktop",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_Kernel",
  "Win32_Storage_FileSystem",
  "Win32_Storage_Packaging_Appx",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Input_Ime", "Win32_UI_TextServices",
  "Win32_UI_Accessibility",
  "Win32_UI_HiDpi",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  "Media_Control",
  "Foundation",
  "Foundation_Collections",
  "Storage_Streams",
  "Win32_Media_Audio_Endpoints",
  "Win32_Media_Audio",
  "Win32_System_WinRT",
  "Win32_System_WinRT_Composition", "UI_Composition", "UI_Composition_Desktop", "System", "Foundation_Numerics",
  "UI_Notifications_Management",
  "UI_Notifications", "ApplicationModel",
  "Win32_System_Ole", "Win32_UI_Shell_Common", "Networking_Connectivity",
  "Win32_Devices_DeviceAndDriverInstallation",
  "Win32_Devices_Properties",
  "Win32_Devices_Bluetooth",
  "Devices_Bluetooth", "Devices_Enumeration", "Devices_Bluetooth_GenericAttributeProfile",
  "Graphics", "Graphics_Capture", "Graphics_DirectX", "Graphics_DirectX_Direct3D11",
  "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common",
  "Win32_System_WinRT_Direct3D11", "Win32_System_WinRT_Graphics_Capture",
] }
windows-sys = { version = "0.61", features = ["Win32_Security", "Win32_System_EventLog", "Win32_System_ProcessStatus"] }
# v0.5.5 邮件：IMAP 走系统 TLS，凭据进 Windows 凭据管理器。
imap = "2.4"
imap-proto = "0.10.2"
native-tls = "0.2"
keyring = { version = "3", features = ["windows-native"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

# 内存剖析专用：带行号表（供 dhat 回溯符号化），其余与 release 一致。
# cargo build --profile memprof --features memprof
[profile.memprof]
inherits = "release"
strip = false
debug = "line-tables-only"
